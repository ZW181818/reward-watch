name: Update official case data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: reward-watch-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Refresh official data
        run: python backend/scripts/update_cases.py --strict --skip-database

      - name: Run ingestion tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Sync validated snapshot to PostgreSQL
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/scripts/sync_database.py

      - name: Commit changed data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- backend/data/cases.json backend/data/source_cases.json backend/data/update_status.json backend/data/data_quality_report.json backend/data/media/texas-dps)" ]; then
            echo "Official data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/cases.json backend/data/source_cases.json backend/data/update_status.json backend/data/data_quality_report.json backend/data/media/texas-dps
          git commit -m "chore(data): refresh official cases"
          git push
