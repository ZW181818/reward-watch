services:
  - type: web
    name: reward-watch-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - backend/data/cases.json
        - backend/data/source_cases.json
        - backend/data/update_status.json
        - backend/data/data_quality_report.json
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://reward-watch.pages.dev
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
